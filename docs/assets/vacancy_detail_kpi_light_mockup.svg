<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#111827" flood-opacity="0.18"/>
    </filter>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#111827" flood-opacity="0.18"/>
    </filter>
    <style>
      .page-bg { fill: #f8fafc; }
      .title { font-family: sans-serif; font-size: 34px; font-weight: 700; fill: #111827; }
      .button { fill: #ffffff; stroke: #9ca3af; stroke-width: 2; }
      .button-text { font-family: sans-serif; font-size: 16px; font-weight: 700; fill: #f59e7d; }
      .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.2; }
      .value { font-family: sans-serif; font-size: 36px; font-weight: 700; fill: #111827; }
      .label { font-family: sans-serif; font-size: 21px; font-weight: 400; fill: #6b7280; }
      .divider { stroke: #e5e7eb; stroke-width: 1.2; }
      .ref { font-family: sans-serif; font-size: 14px; font-weight: 400; fill: #8a8f98; }
      .ref-value { font-family: sans-serif; font-size: 14px; font-weight: 600; }
      .teal { fill: #0f766e; }
      .blue { fill: #2563eb; }
      .green { fill: #15803d; }
      .orange { fill: #c2410c; }
      .gray { fill: #6b7280; }
      .table-panel { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.2; }
      .table-head { fill: #f8c9b8; }
      .table-head-text { font-family: sans-serif; font-size: 16px; font-weight: 700; fill: #111827; }
      .table-text { font-family: sans-serif; font-size: 15px; font-weight: 400; fill: #374151; }
      .row-line { stroke: #e5e7eb; stroke-width: 1; }
      .note { font-family: sans-serif; font-size: 15px; font-weight: 400; fill: #6b7280; }
    </style>
  </defs>

  <rect class="page-bg" width="1600" height="900"/>
  <text class="title" x="120" y="88">VIC Vacancy Detail Page</text>

  <rect class="button" x="1325" y="52" rx="28" ry="28" width="142" height="56"/>
  <text class="button-text" x="1370" y="88">Filters</text>

  <!-- KPI cards -->
  <g filter="url(#cardShadow)">
    <rect class="card" x="120" y="168" width="225" height="255" rx="14"/>
    <text class="value" x="150" y="238">5</text>
    <text class="label" x="150" y="272">Vacancy Count</text>
    <line class="divider" x1="150" y1="296" x2="315" y2="296"/>
    <text class="ref" x="150" y="336">Has Tenantable</text>
    <text class="ref-value teal" x="282" y="336">4</text>
    <text class="ref" x="150" y="366">Has Untenantable</text>
    <text class="ref-value orange" x="304" y="366">4</text>
    <text class="ref" x="150" y="396">Has Other</text>
    <text class="ref-value gray" x="235" y="396">1</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect class="card" x="400" y="168" width="225" height="255" rx="14"/>
    <text class="value" x="430" y="238">84</text>
    <text class="label" x="430" y="272">Vacancy Days</text>
    <line class="divider" x1="430" y1="296" x2="595" y2="296"/>
    <text class="ref" x="430" y="346">Avg (All)</text>
    <text class="ref-value blue" x="510" y="346">16.80</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect class="card" x="680" y="168" width="225" height="255" rx="14"/>
    <text class="value" x="710" y="238">20</text>
    <text class="label" x="710" y="272">Tenantable Days</text>
    <line class="divider" x1="710" y1="296" x2="875" y2="296"/>
    <text class="ref" x="710" y="336">Avg (All)</text>
    <text class="ref-value green" x="790" y="336">4.00</text>
    <text class="ref" x="710" y="366">Avg (&gt;0 Only)</text>
    <text class="ref-value green" x="822" y="366">5.00</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect class="card" x="960" y="168" width="225" height="255" rx="14"/>
    <text class="value" x="990" y="238">61</text>
    <text class="label" x="990" y="272">Untenantable Days</text>
    <line class="divider" x1="990" y1="296" x2="1155" y2="296"/>
    <text class="ref" x="990" y="336">Avg (All)</text>
    <text class="ref-value orange" x="1070" y="336">12.20</text>
    <text class="ref" x="990" y="366">Avg (&gt;0 Only)</text>
    <text class="ref-value orange" x="1102" y="366">15.25</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect class="card" x="1240" y="168" width="225" height="255" rx="14"/>
    <text class="value" x="1270" y="238">3</text>
    <text class="label" x="1270" y="272">Other Days</text>
    <line class="divider" x1="1270" y1="296" x2="1435" y2="296"/>
    <text class="ref" x="1270" y="336">Avg (All)</text>
    <text class="ref-value gray" x="1350" y="336">0.60</text>
    <text class="ref" x="1270" y="366">Avg (&gt;0 Only)</text>
    <text class="ref-value gray" x="1382" y="366">3.00</text>
  </g>

  <text class="note" x="120" y="462">Use color on the values, not the entire label. Keep the cards white so the KPIs remain export-friendly and readable.</text>

  <!-- Table preview -->
  <g filter="url(#panelShadow)">
    <rect class="table-panel" x="120" y="500" width="1350" height="295" rx="18"/>
    <rect class="table-head" x="140" y="525" width="1310" height="66" rx="2"/>
    <text class="table-head-text" x="165" y="565">Vacancy Start Date</text>
    <text class="table-head-text" x="360" y="565">Vacancy End Date</text>
    <text class="table-head-text" x="550" y="565">Void Start Date</text>
    <text class="table-head-text" x="735" y="565">Void End Date</text>
    <text class="table-head-text" x="910" y="565">Vacancy Days</text>
    <text class="table-head-text" x="1055" y="565">Tenantable</text>
    <text class="table-head-text" x="1185" y="565">Untenantable</text>
    <text class="table-head-text" x="1340" y="565">Other</text>

    <line class="row-line" x1="140" y1="640" x2="1450" y2="640"/>
    <line class="row-line" x1="140" y1="690" x2="1450" y2="690"/>
    <line class="row-line" x1="140" y1="740" x2="1450" y2="740"/>

    <text class="table-text" x="165" y="625">10/01/2026</text>
    <text class="table-text" x="360" y="625">15/01/2026</text>
    <text class="table-text" x="550" y="625">-</text>
    <text class="table-text" x="735" y="625">-</text>
    <text class="table-text" x="950" y="625">6</text>
    <text class="table-text" x="1095" y="625">6</text>
    <text class="table-text" x="1240" y="625">0</text>
    <text class="table-text" x="1370" y="625">0</text>

    <text class="table-text" x="165" y="675">25/02/2026</text>
    <text class="table-text" x="360" y="675">25/03/2026</text>
    <text class="table-text" x="550" y="675">25/02/2026</text>
    <text class="table-text" x="735" y="675">27/03/2026</text>
    <text class="table-text" x="950" y="675">29</text>
    <text class="table-text" x="1095" y="675">0</text>
    <text class="table-text" x="1240" y="675">29</text>
    <text class="table-text" x="1370" y="675">0</text>

    <rect x="140" y="690" width="1310" height="50" fill="#f3f4f6"/>
    <text class="table-text" x="165" y="725">04/12/2025</text>
    <text class="table-text" x="360" y="725">09/01/2026</text>
    <text class="table-text" x="550" y="725">03/12/2025</text>
    <text class="table-text" x="735" y="725">07/01/2026</text>
    <text class="table-text" x="950" y="725">8</text>
    <text class="table-text" x="1095" y="725">2</text>
    <text class="table-text" x="1240" y="725">3</text>
    <text class="table-text" x="1370" y="725">3</text>

    <text class="table-text" x="165" y="775">09/04/2026</text>
    <text class="table-text" x="360" y="775">06/05/2026</text>
    <text class="table-text" x="550" y="775">10/04/2026</text>
    <text class="table-text" x="735" y="775">01/05/2026</text>
    <text class="table-text" x="950" y="775">22</text>
    <text class="table-text" x="1095" y="775">1</text>
    <text class="table-text" x="1240" y="775">21</text>
    <text class="table-text" x="1370" y="775">0</text>
  </g>
</svg>
